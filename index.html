<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏の詩</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #7db9e8 100%);
            overflow: hidden;
            position: relative;
        }

        /* 泡の背景エフェクト */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
        }

        .rain {
            position: absolute;
            inset: 0;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .rain span {
            position: absolute;
            top: -15%;
            width: 2px;
            height: 90px;
            background: linear-gradient(180deg, rgba(173, 216, 230, 0), rgba(173, 216, 230, 0.9), rgba(173, 216, 230, 0));
            border-radius: 999px;
            opacity: 0;
            animation: fall linear infinite;
        }

        .bubble {
            position: absolute;
            bottom: -100px;
            background: rgba(255, 255, 255, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.5);
            animation: rise 10s infinite ease-in;
        }

        /* 異なるサイズと速度の泡 */
        .bubble:nth-child(1) { left: 10%; width: 40px; height: 40px; animation-duration: 8s; animation-delay: 0s; }
        .bubble:nth-child(2) { left: 20%; width: 20px; height: 20px; animation-duration: 5s; animation-delay: 1s; }
        .bubble:nth-child(3) { left: 35%; width: 50px; height: 50px; animation-duration: 10s; animation-delay: 2s; }
        .bubble:nth-child(4) { left: 50%; width: 15px; height: 15px; animation-duration: 6s; animation-delay: 0s; }
        .bubble:nth-child(5) { left: 65%; width: 35px; height: 35px; animation-duration: 7s; animation-delay: 3s; }
        .bubble:nth-child(6) { left: 75%; width: 25px; height: 25px; animation-duration: 9s; animation-delay: 1s; }
        .bubble:nth-child(7) { left: 88%; width: 45px; height: 45px; animation-duration: 11s; animation-delay: 4s; }

        @keyframes rise {
            0% {
                bottom: -100px;
                transform: translateX(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                bottom: 108vh;
                transform: translateX(100px);
                opacity: 0;
            }
        }

        @keyframes fall {
            0% {
                transform: translate3d(0, -10vh, 0) rotate(12deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            100% {
                transform: translate3d(20px, 110vh, 0) rotate(12deg);
                opacity: 0;
            }
        }

        .rain span:nth-child(1)  { left: 4%;  animation-duration: 1.2s; animation-delay: 0.2s; }
        .rain span:nth-child(2)  { left: 9%;  animation-duration: 1.8s; animation-delay: 0.4s; }
        .rain span:nth-child(3)  { left: 14%; animation-duration: 1.4s; animation-delay: 0.8s; }
        .rain span:nth-child(4)  { left: 19%; animation-duration: 1.9s; animation-delay: 0.1s; }
        .rain span:nth-child(5)  { left: 24%; animation-duration: 1.6s; animation-delay: 0.5s; }
        .rain span:nth-child(6)  { left: 29%; animation-duration: 2.1s; animation-delay: 0.7s; }
        .rain span:nth-child(7)  { left: 34%; animation-duration: 1.3s; animation-delay: 0.3s; }
        .rain span:nth-child(8)  { left: 39%; animation-duration: 2.0s; animation-delay: 0.9s; }
        .rain span:nth-child(9)  { left: 44%; animation-duration: 1.7s; animation-delay: 0.2s; }
        .rain span:nth-child(10) { left: 49%; animation-duration: 1.5s; animation-delay: 0.6s; }
        .rain span:nth-child(11) { left: 54%; animation-duration: 2.2s; animation-delay: 0.4s; }
        .rain span:nth-child(12) { left: 59%; animation-duration: 1.8s; animation-delay: 0.8s; }
        .rain span:nth-child(13) { left: 64%; animation-duration: 1.4s; animation-delay: 0.1s; }
        .rain span:nth-child(14) { left: 69%; animation-duration: 2.4s; animation-delay: 0.5s; }
        .rain span:nth-child(15) { left: 74%; animation-duration: 1.6s; animation-delay: 0.9s; }
        .rain span:nth-child(16) { left: 79%; animation-duration: 1.9s; animation-delay: 0.3s; }
        .rain span:nth-child(17) { left: 84%; animation-duration: 1.5s; animation-delay: 0.7s; }
        .rain span:nth-child(18) { left: 89%; animation-duration: 2.1s; animation-delay: 0.2s; }
        .rain span:nth-child(19) { left: 94%; animation-duration: 1.7s; animation-delay: 0.6s; }
        .rain span:nth-child(20) { left: 12%; animation-duration: 2.3s; animation-delay: 1.1s; }
        .rain span:nth-child(21) { left: 22%; animation-duration: 1.8s; animation-delay: 1.4s; }
        .rain span:nth-child(22) { left: 32%; animation-duration: 1.4s; animation-delay: 1.2s; }
        .rain span:nth-child(23) { left: 42%; animation-duration: 2.0s; animation-delay: 1.6s; }
        .rain span:nth-child(24) { left: 52%; animation-duration: 1.6s; animation-delay: 1.3s; }
        .rain span:nth-child(25) { left: 62%; animation-duration: 2.2s; animation-delay: 1.5s; }
        .rain span:nth-child(26) { left: 72%; animation-duration: 1.7s; animation-delay: 1.0s; }
        .rain span:nth-child(27) { left: 82%; animation-duration: 2.1s; animation-delay: 1.8s; }
        .rain span:nth-child(28) { left: 92%; animation-duration: 1.9s; animation-delay: 1.1s; }
        .rain span:nth-child(29) { left: 7%;  animation-duration: 2.5s; animation-delay: 1.9s; }
        .rain span:nth-child(30) { left: 17%; animation-duration: 1.5s; animation-delay: 1.7s; }

        /* すりガラス風の詩カード */
        .poem-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 50px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
            text-align: center;
            max-width: 440px;
            color: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 24px;
            letter-spacing: 4px;
            font-weight: normal;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        p {
            font-size: 1.1rem;
            line-height: 2.1;
            margin: 10px 0;
            letter-spacing: 2px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .highlight {
            color: #ffd166;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 泡と雨の背景アニメーション -->
    <div class="bubbles">
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
        <div class="bubble"></div>
    </div>

    <div class="rain" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- 詩カード -->
    <div class="poem-card">
        <h1>『夏の詩』</h1>
        <p>蝉時雨が午後の影を伸ばし</p>
        <p>そよ風が<span class="highlight">青葉</span>を揺らす</p>
        <p>サイダーの泡が密やかに弾け</p>
        <p>この季節のすべての熱気を</p>
        <p>蒼い波の彼方へ閉じ込めた</p>
    </div>

</body>
</html>
